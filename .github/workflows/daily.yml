name: daily-digest

# 在 GitHub 上零安装运行：把 API Key 加进仓库 Secrets 即可，
# 每天自动生成 PDF 日报并上传为 Artifact。
# 注意：GitHub 的 cron 使用 UTC，且高峰期可能延迟数分钟到数十分钟。
#       19:00 Asia/Shanghai = 11:00 UTC。
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: '目标报告日 YYYY-MM-DD（留空 = 配置文件默认，即前一天）'
        required: false
        default: ''
      use_llm:
        description: '是否调用大模型生成摘要'
        type: boolean
        default: true

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # WeasyPrint 的系统依赖
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: assets/mathjax/package.json

      - name: Install MathJax (optional, for LaTeX-grade formulas)
        run: cd assets/mathjax && npm install --no-audit --no-fund
        continue-on-error: true

      - name: Prepare config
        run: |
          if [ ! -f config.json ]; then cp config.example.json config.json; fi

      - name: Generate daily report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.day }}" ]; then ARGS="--day ${{ github.event.inputs.day }}"; fi
          if [ "${{ github.event.inputs.use_llm }}" = "false" ]; then ARGS="$ARGS --no-llm"; fi
          python run.py daily $ARGS

      - name: Show status
        run: python run.py status

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: reports/
          retention-days: 90
          if-no-files-found: warn

      # 可选：把生成的报告提交到独立分支，避免 main 分支体积膨胀。
      # 打开下面这段即可启用（报告会出现在 reports 分支上，可直接用 GitHub Pages 浏览）。
      #
      # - name: Publish reports to a dedicated branch
      #   run: |
      #     git config user.name  "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add -f reports/
      #     git commit -m "reports: $(date -u +%F)" || echo "no changes"
      #     git push origin HEAD:reports --force
