name: ci

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']      # tag 由 release.yml 负责
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install weasyprint

      # 测试用例本身是离线的（不联网、不调用模型），只依赖标准库 + weasyprint
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Syntax check (warnings as errors)
        run: |
          python -W error::SyntaxWarning -m compileall -q arxiv_daily_report tests run.py

  packaging:
    # 保证任何分支上的打包流程都能跑通，避免 tag 时才发现模板坏了
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nfpm
        run: |
          set -euo pipefail
          curl -sSL --retry 3 -o /tmp/nfpm.tgz \
            "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          tar xzf /tmp/nfpm.tgz -C "$HOME/.local/bin" nfpm
          chmod +x "$HOME/.local/bin/nfpm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build all three package formats
        run: ./packaging/build-packages.sh
      - name: Verify package layout and cleanliness
        # 对 .deb 不能用 bsdtar（只列出 ar 成员，不进内层 tarball），
        # packaging/verify-packages.py 会按格式分别正确读取
        run: python3 packaging/verify-packages.py "dist/*.deb" "dist/*.rpm" "dist/*.pkg.tar.zst"
