[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-daily-report"
version = "0.2.0"
description = "arXiv 论文日报：按分类抓取新增论文、生成 PDF 报告与月度综述"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "arxiv-daily-report contributors" }]
keywords = ["arxiv", "digest", "relativity", "gravitation", "pdf", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "weasyprint>=62,<71",
]

[project.optional-dependencies]
# 只用标准库的核心流程无需额外依赖；下面这组用于开发期检查
dev = ["ruff>=0.6", "pytest>=8"]

[project.scripts]
arxiv-daily-report = "arxiv_daily_report.cli:main"

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools]
packages = ["arxiv_daily_report", "arxiv_daily_report.llm"]

[tool.setuptools.package-data]
arxiv_daily_report = ["../data/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
